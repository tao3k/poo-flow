name: Core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    name: Native Gerbil (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates git jq libsqlite3-dev libssl-dev openssl pkg-config sqlite3 zlib1g-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew list --formula ghostscript >/dev/null 2>&1 && brew unlink ghostscript || true
          brew install gcc jq openssl pkg-config sqlite zlib
          gcc_prefix="$(brew --prefix gcc)"
          gcc_bin="$(find "$gcc_prefix/bin" -maxdepth 1 -type f -name 'gcc-[0-9]*' | awk -F- '{print $NF "\t" $0}' | sort -n | tail -n 1 | cut -f2-)"
          test -x "$gcc_bin"
          echo "GERBIL_GCC=$gcc_bin" >> "$GITHUB_ENV"
          openssl_prefix="$(brew --prefix openssl@3 2>/dev/null || brew --prefix openssl)"
          echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
      - name: Install immutable Gerbil release
        run: bash tools/ci/install-gerbil-v19-release.sh "$GITHUB_WORKSPACE/.ci/gerbil-release/v0.19-2591dcd"
      - name: Restore Gerbil dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib
            .gerbil/bin
          key: core-gerbil-${{ runner.os }}-${{ runner.arch }}-v0.19-2591dcd-${{ hashFiles('gerbil.pkg') }}
      - name: Install pinned dependencies
        run: GERBIL_BUILD_VERBOSE=1 gerbil deps --install
      - name: Build Core
        run: GERBIL_BUILD_VERBOSE=1 gerbil build
      - name: Test Core
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          gerbil -:max-heap=1G,debug=q test t 2>&1 | tee "$log"
          if grep -E 'ERROR (CHECK|CASE|HARNESS)|Heap overflow|Stack overflow' "$log" >/dev/null; then exit 1; fi
          grep -F 'HARNESS-OK' "$log" >/dev/null
          grep -x 'OK' "$log" >/dev/null
