name: Set up project-local native Gerbil
description: Install and cache an immutable gerbil-bazel release without changing the runner user environment.

inputs:
  project-root:
    description: POO Flow checkout root relative to github.workspace.
    required: false
    default: .
  release-tag:
    description: Exact gerbil-bazel release tag.
    required: false
    default: gerbil-v0.18.2-07c84815-linux-x86_64-ee5a236818e1b8fd9cc6e886b510795495e95402e790892961e6a1059a5c3208
  release-archive:
    description: Exact gerbil-bazel release archive.
    required: false
    default: gerbil-v0.18.2-07c84815-linux-x86_64-ee5a236818e1b8fd9cc6e886b510795495e95402e790892961e6a1059a5c3208.tar.gz
  release-sha256:
    description: SHA-256 of the immutable release archive.
    required: false
    default: 741d67f1d1a37e057181bfe8b3348ce2a9cfce06ac3b9c4e914400978f9d5fe7
  install-digest:
    description: Expected gerbil-bazel native install digest.
    required: false
    default: ee5a236818e1b8fd9cc6e886b510795495e95402e790892961e6a1059a5c3208
  gerbil-label:
    description: Stable cache label for the selected release.
    required: false
    default: prebuilt-v0.18.2-07c84815

runs:
  using: composite
  steps:
    - name: Install native build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ca-certificates \
          curl \
          git \
          jq \
          libsqlite3-dev \
          libssl-dev \
          openssl \
          pkg-config \
          sqlite3 \
          zlib1g-dev

    - name: Declare project-local Gerbil environment
      shell: bash
      env:
        PROJECT_ROOT_INPUT: ${{ inputs.project-root }}
        GERBIL_LABEL_INPUT: ${{ inputs.gerbil-label }}
      run: |
        set -euo pipefail
        test "$RUNNER_OS" = "Linux"
        test "$RUNNER_ARCH" = "X64"
        project_root="$GITHUB_WORKSPACE/$PROJECT_ROOT_INPUT"
        local_home="$project_root/.ci/home"
        gerbil_release_root="$project_root/.ci/gerbil-release/$GERBIL_LABEL_INPUT"
        gerbil_prefix="$gerbil_release_root/prefix/current"
        mkdir -p "$local_home" "$(dirname "$gerbil_release_root")"
        echo "$gerbil_prefix/bin" >> "$GITHUB_PATH"
        {
          echo "HOME=$local_home"
          echo "GERBIL_PREFIX=$gerbil_prefix"
          echo "GERBIL_HOME=$gerbil_prefix"
        } >> "$GITHUB_ENV"

    - name: Restore native Gerbil release
      id: gerbil-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.project-root }}/.ci/gerbil-release/${{ inputs.gerbil-label }}
        key: downstream-gerbil-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.gerbil-label }}-${{ inputs.release-sha256 }}

    - name: Install immutable native Gerbil release
      if: steps.gerbil-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PROJECT_ROOT_INPUT: ${{ inputs.project-root }}
        GERBIL_LABEL_INPUT: ${{ inputs.gerbil-label }}
        RELEASE_TAG_INPUT: ${{ inputs.release-tag }}
        RELEASE_ARCHIVE_INPUT: ${{ inputs.release-archive }}
        RELEASE_SHA256_INPUT: ${{ inputs.release-sha256 }}
      run: |
        set -euo pipefail
        release_root="$GITHUB_WORKSPACE/$PROJECT_ROOT_INPUT/.ci/gerbil-release/$GERBIL_LABEL_INPUT"
        archive_path="$RUNNER_TEMP/$RELEASE_ARCHIVE_INPUT"
        url="https://github.com/tao3k/gerbil-bazel/releases/download/$RELEASE_TAG_INPUT/$RELEASE_ARCHIVE_INPUT"
        mkdir -p "$release_root"
        curl --fail --location --retry 3 --output "$archive_path" "$url"
        echo "$RELEASE_SHA256_INPUT  $archive_path" | sha256sum --check
        tar -xzf "$archive_path" -C "$release_root"

    - name: Verify immutable native Gerbil release
      shell: bash
      env:
        PROJECT_ROOT_INPUT: ${{ inputs.project-root }}
        GERBIL_LABEL_INPUT: ${{ inputs.gerbil-label }}
        INSTALL_DIGEST_INPUT: ${{ inputs.install-digest }}
      run: |
        set -euo pipefail
        release_root="$GITHUB_WORKSPACE/$PROJECT_ROOT_INPUT/.ci/gerbil-release/$GERBIL_LABEL_INPUT"
        manifest="$release_root/gerbil-bazel-capability.json"
        jq -e --arg digest "$INSTALL_DIGEST_INPUT" \
          '.schema == "gerbil-bazel.prebuilt-capability-manifest.v1" and
           .installDigest == $digest and
           .platform.os == "linux" and .platform.arch == "x86_64"' \
          "$manifest" >/dev/null
        test -x "$GERBIL_PREFIX/bin/gerbil"
        gerbil --version
        gxi -e '(begin (import :std/make) (displayln "gerbil-release-ready"))'

    - name: Save native Gerbil release
      if: steps.gerbil-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.project-root }}/.ci/gerbil-release/${{ inputs.gerbil-label }}
        key: downstream-gerbil-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.gerbil-label }}-${{ inputs.release-sha256 }}

    - name: Restore declared Gerbil packages
      id: package-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ inputs.project-root }}/.gerbil/pkg
          ${{ inputs.project-root }}/.gerbil/lib
          ${{ inputs.project-root }}/.gerbil/bin
        key: downstream-gerbil-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.gerbil-label }}-${{ hashFiles(format('{0}/gerbil.pkg', inputs.project-root)) }}

    - name: Resolve declared Gerbil packages
      shell: bash
      env:
        PROJECT_ROOT_INPUT: ${{ inputs.project-root }}
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE/$PROJECT_ROOT_INPUT"
        mkdir -p "$HOME/.gerbil/pkg"
        gerbil pkg dir --add git.cons.io/mighty-gerbils/gerbil-directory
        if [ "${{ steps.package-cache.outputs.cache-hit }}" = "true" ]; then
          if ! gerbil env gerbil interactive -e '(begin (import :asp-gerbil-scheme/building-api :asp-gerbil-scheme/testing-api) (displayln "dependency-cache-ready"))'; then
            gerbil deps --update
          fi
        else
          gerbil deps --install
        fi
        gerbil env gerbil interactive -e '(begin (import :asp-gerbil-scheme/building-api :asp-gerbil-scheme/testing-api) (displayln "native-capability-ready"))'

    - name: Save declared Gerbil packages
      if: steps.package-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ inputs.project-root }}/.gerbil/pkg
          ${{ inputs.project-root }}/.gerbil/lib
          ${{ inputs.project-root }}/.gerbil/bin
        key: downstream-gerbil-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.gerbil-label }}-${{ hashFiles(format('{0}/gerbil.pkg', inputs.project-root)) }}
