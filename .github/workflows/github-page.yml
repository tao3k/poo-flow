name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/github-page.yml"
      - "docs/**"
      - "ORG_ZHIXING_REV"
      - "org-zhixing.toml"
  pull_request:
    paths:
      - ".github/workflows/github-page.yml"
      - "docs/**"
      - "ORG_ZHIXING_REV"
      - "org-zhixing.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORG_ZHIXING_REPOSITORY: tao3k/org-zhixing-themes

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ORG_ZHIXING_ROOT: ${{ github.workspace }}/.ci/org-zhixing
      PAGES_OUTPUT: ${{ github.workspace }}/.ci/poo-flow-pages
    steps:
      - name: Checkout POO Flow content
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Fetch Org Zhixing site builder
        shell: bash
        run: |
          set -euo pipefail
          ORG_ZHIXING_REV="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/ORG_ZHIXING_REV")"
          if [[ ! "$ORG_ZHIXING_REV" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ORG_ZHIXING_REV must contain one full 40-character commit SHA" >&2
            exit 1
          fi
          git init "$ORG_ZHIXING_ROOT"
          git -C "$ORG_ZHIXING_ROOT" remote add origin \
            "https://github.com/${ORG_ZHIXING_REPOSITORY}.git"
          git -C "$ORG_ZHIXING_ROOT" fetch --depth=1 origin "$ORG_ZHIXING_REV"
          git -C "$ORG_ZHIXING_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$ORG_ZHIXING_ROOT" rev-parse HEAD)" = "$ORG_ZHIXING_REV"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Org Zhixing
        working-directory: ${{ env.ORG_ZHIXING_ROOT }}
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build documents site
        working-directory: ${{ env.ORG_ZHIXING_ROOT }}
        run: |
          npm run pages:build -- \
            --config "$GITHUB_WORKSPACE/org-zhixing.toml" \
            --content "$GITHUB_WORKSPACE/docs" \
            --base /poo-flow/ \
            --out "$PAGES_OUTPUT"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.PAGES_OUTPUT }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
