name: Scheme compile performance audit

on:
  workflow_call:
    inputs:
      baseline_ref:
        description: Known-good Git revision with the canonical Scheme Bazel targets
        required: true
        type: string
      sample_count:
        description: Odd cold-sample count per revision
        required: true
        type: string
      maximum_regression_basis_points:
        description: Maximum accepted candidate median regression
        required: true
        type: string
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Known-good Git revision with the canonical Scheme Bazel targets
        required: true
        type: string
      sample_count:
        description: Odd cold-sample count per revision
        required: true
        default: "3"
        type: string
      maximum_regression_basis_points:
        description: Maximum accepted candidate median regression
        required: true
        default: "500"
        type: string

permissions:
  contents: read

concurrency:
  group: scheme-compile-performance-audit
  cancel-in-progress: false

jobs:
  same-host-comparison:
    name: same-host 3+3 cold and warm/no-op
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Check out baseline
        uses: actions/checkout@v4
        with:
          path: baseline
          ref: ${{ inputs.baseline_ref }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libssl-dev zlib1g-dev

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: scheme-compile-performance-audit
          repository-cache: true

      - name: Run Scheme-owned same-host audit
        working-directory: candidate
        env:
          AUDIT_OUTPUT: ${{ runner.temp }}/scheme-compile-performance-audit
          BASELINE_WORKSPACE: ${{ github.workspace }}/baseline
          CANDIDATE_WORKSPACE: ${{ github.workspace }}/candidate
          HOST_SESSION_ID: github/${{ github.run_id }}/${{ github.run_attempt }}
          RUNNER_IDENTITY: ${{ runner.os }}-${{ runner.arch }}
        run: |
          baseline_revision="$(git -C "$BASELINE_WORKSPACE" rev-parse HEAD)"
          candidate_revision="$(git -C "$CANDIDATE_WORKSPACE" rev-parse HEAD)"
          bazelisk run //scheme:compile_performance_audit -- \
            "$(command -v bazelisk)" \
            "$BASELINE_WORKSPACE" \
            "$CANDIDATE_WORKSPACE" \
            "$baseline_revision" \
            "$candidate_revision" \
            "$HOST_SESSION_ID" \
            "$RUNNER_IDENTITY" \
            "$AUDIT_OUTPUT" \
            "${{ inputs.sample_count }}" \
            "${{ inputs.maximum_regression_basis_points }}"

      - name: Validate median budget through POO objects
        working-directory: candidate
        env:
          AUDIT_OUTPUT: ${{ runner.temp }}/scheme-compile-performance-audit
        run: |
          bazelisk run //scheme:validate_compile_performance_budget -- \
            "$AUDIT_OUTPUT/comparison-input.json" \
            "$AUDIT_OUTPUT/comparison-receipt.json"

      - name: Upload performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: scheme-compile-performance-audit
          path: |
            ${{ runner.temp }}/scheme-compile-performance-audit/audit-receipt.json
            ${{ runner.temp }}/scheme-compile-performance-audit/comparison-input.json
            ${{ runner.temp }}/scheme-compile-performance-audit/comparison-receipt.json
            ${{ runner.temp }}/scheme-compile-performance-audit/warm-noop-receipt.json
            ${{ runner.temp }}/scheme-compile-performance-audit/warm-noop.bep.json
            ${{ runner.temp }}/scheme-compile-performance-audit/baseline-*/bazel-bin/scheme/compile.receipt.json
            ${{ runner.temp }}/scheme-compile-performance-audit/candidate-*/bazel-bin/scheme/compile.receipt.json
          if-no-files-found: warn
