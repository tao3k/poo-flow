name: workflow lint

on:
  push:
    paths:
      - .github/workflows/**
  pull_request:
    paths:
      - .github/workflows/**

concurrency:
  group: workflow-lint-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
