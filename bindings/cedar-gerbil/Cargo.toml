[workspace]
members = ["crates/cedar-authority", "crates/cedar-gerbil"]
default-members = ["crates/cedar-authority", "crates/cedar-gerbil"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
cedar-policy = { version = "=4.12.0", default-features = false, features = ["protobufs"] }
ed25519-dalek = "=2.2.0"
gerbil-scheme = { git = "https://github.com/tao3k/gerbil-scheme-rust.git", rev = "de5d017ee225b0a9e5cffe483848b270c69e5f4e", features = ["external-program"] }
gerbil-scheme-native-build = { git = "https://github.com/tao3k/gerbil-scheme-rust.git", rev = "de5d017ee225b0a9e5cffe483848b270c69e5f4e" }
gerbil-scheme-sys = { git = "https://github.com/tao3k/gerbil-scheme-rust.git", rev = "de5d017ee225b0a9e5cffe483848b270c69e5f4e", features = ["external-program"] }
getrandom = "0.3"
hex = "=0.4.3"
poo-flow-cedar-authority = { path = "crates/cedar-authority" }
prost = "=0.14.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.11.0"
tempfile = "3.23"
thiserror = "2.0"

[workspace.metadata.poo-flow.cedar-runtime]
runtime-host-input = "POO_FLOW_CEDAR_RUNTIME_HOST"
runtime-core-archive-input = "POO_FLOW_CEDAR_RUNTIME_CORE_ARCHIVE"
runtime-endpoint-input = "POO_FLOW_CEDAR_RUNTIME_SOCKET"
native-probe-input = "POO_FLOW_CEDAR_NATIVE_PROBE"

[profile.dev]
opt-level = 2
debug = 2
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "thin"
overflow-checks = true

[profile.dev.build-override]
opt-level = 2

[profile.release.build-override]
opt-level = 3
