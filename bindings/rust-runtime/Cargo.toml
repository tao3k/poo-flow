[package]
name = "poo-flow-rust-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 AND LGPL-2.1-or-later"
publish = false
[dependencies]
libloading = "0.8.9"
sha2 = "0.10.9"

[features]
default = []
mrr-transport = ["dep:meta-relational-reasoning"]
mrr-context = ["mrr-transport", "meta-relational-reasoning/agentic-ai-context"]
org-memory = ["dep:orgize"]
[dependencies.meta-relational-reasoning]
git = "https://github.com/tao3k/meta-relational-reasoning.git"
rev = "d5beb4030bf875fa851cddc27789030c551154c3"
optional = true
default-features = false
[dependencies.orgize]
git = "https://github.com/tao3k/orgize.git"
rev = "16d2a8c3ac168d73b890262b29b756d4b4ec3361"
optional = true
default-features = false
