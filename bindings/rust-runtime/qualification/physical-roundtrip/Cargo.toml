[package]
name = "poo-temporal-physical-roundtrip"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0 AND LGPL-2.1-or-later"
[workspace]
[workspace.package]
license = "Apache-2.0 AND LGPL-2.1-or-later"
[dependencies]
poo-flow-rust-runtime = { path = "../..", features = ["mrr-transport"] }
meta-relational-reasoning = { git = "https://github.com/tao3k/meta-relational-reasoning.git", rev = "8f389fd0aede8d8000197c959da69b6ba3e9bb86", default-features = false }
mrr-property-source = { git = "https://github.com/tao3k/meta-relational-reasoning.git", rev = "8f389fd0aede8d8000197c959da69b6ba3e9bb86" }
mrr-data-core = { git = "https://github.com/tao3k/mrr-data.git", rev = "f9be539f0a3896ff56e77fcaa40b7ae57e9ec368", features = ["content-identity"] }
mrr-data-content = { git = "https://github.com/tao3k/mrr-data.git", rev = "f9be539f0a3896ff56e77fcaa40b7ae57e9ec368", features = ["snapshot"] }
mrr-data-datafusion = { git = "https://github.com/tao3k/mrr-data.git", rev = "f9be539f0a3896ff56e77fcaa40b7ae57e9ec368" }
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
arrow-ipc = "58.4.0"
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt", "macros"] }

# Match the physical owner's qualified test build; preserve native integer precision.
[profile.dev]
opt-level = 2
codegen-units = 16
debug = false

[build-dependencies]
toml = "0.9.12"
