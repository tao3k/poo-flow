[package]
name = "poo-temporal-physical-roundtrip"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0 AND LGPL-2.1-or-later"
[workspace]
[workspace.package]
license = "Apache-2.0 AND LGPL-2.1-or-later"
[dependencies]
poo-flow-rust-runtime = { path = "../..", features = ["mrr-transport"] }
meta-relational-reasoning = { git = "https://github.com/tao3k/meta-relational-reasoning.git", rev = "ffde2798a5246a61f4d6f0e66d7f05156e55e38f", default-features = false }
mrr-property-source = { git = "https://github.com/tao3k/meta-relational-reasoning.git", rev = "ffde2798a5246a61f4d6f0e66d7f05156e55e38f" }
mrr-data-core = { git = "https://github.com/tao3k/mrr-data.git", rev = "534afe6c946088b8b0fe4e3a4b2bcdbbb50e6873", features = ["content-identity"] }
mrr-data-content = { git = "https://github.com/tao3k/mrr-data.git", rev = "534afe6c946088b8b0fe4e3a4b2bcdbbb50e6873", features = ["snapshot"] }
mrr-data-datafusion = { git = "https://github.com/tao3k/mrr-data.git", rev = "534afe6c946088b8b0fe4e3a4b2bcdbbb50e6873" }
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
arrow-ipc = "58.4.0"
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt", "macros"] }

# Match the physical owner's qualified test build; preserve native integer precision.
[profile.dev]
opt-level = 2
codegen-units = 16
debug = false

[build-dependencies]
toml = "0.9.12"
