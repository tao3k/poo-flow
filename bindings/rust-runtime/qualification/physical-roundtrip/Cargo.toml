[package]
name = "poo-temporal-physical-roundtrip"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0 AND LGPL-2.1-or-later"
[workspace]
[workspace.package]
license = "Apache-2.0 AND LGPL-2.1-or-later"
[dependencies]
poo-flow-rust-runtime = { path = "../..", features = ["mrr-transport"] }
meta-relational-reasoning = { git = "https://github.com/tao3k/meta-relational-reasoning.git", rev = "9ee5ace469e7a9319c74b8be0308e9062a47e587", default-features = false }
mrr-property-source = { git = "https://github.com/tao3k/meta-relational-reasoning.git", rev = "9ee5ace469e7a9319c74b8be0308e9062a47e587" }
mrr-data-core = { git = "https://github.com/tao3k/mrr-data.git", rev = "21e853dad5c5c120ca54cfd619efb855e94a4f3b", features = ["content-identity"] }
mrr-data-content = { git = "https://github.com/tao3k/mrr-data.git", rev = "21e853dad5c5c120ca54cfd619efb855e94a4f3b", features = ["snapshot"] }
mrr-data-datafusion = { git = "https://github.com/tao3k/mrr-data.git", rev = "21e853dad5c5c120ca54cfd619efb855e94a4f3b" }
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
arrow-ipc = "58.4.0"
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt", "macros"] }

# Match the physical owner's qualified test build; preserve native integer precision.
[profile.dev]
opt-level = 2
codegen-units = 16
debug = false
