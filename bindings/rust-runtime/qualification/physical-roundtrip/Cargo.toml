[package]
name = "poo-temporal-physical-roundtrip"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0 AND LGPL-2.1-or-later"
[workspace]
[workspace.package]
license = "Apache-2.0 AND LGPL-2.1-or-later"
[dependencies]
poo-flow-rust-runtime = { path = "../..", features = ["mrr-transport"] }
meta-relational-reasoning = { git = "https://github.com/tao3k/meta-relational-reasoning.git", rev = "4ccca987c97065499a366b9d1980419a574032a8", default-features = false }
mrr-property-source = { git = "https://github.com/tao3k/meta-relational-reasoning.git", rev = "4ccca987c97065499a366b9d1980419a574032a8" }
mrr-data-core = { git = "https://github.com/tao3k/mrr-data.git", rev = "203dec657ba4e57ba4b8313ae18415aab5547f95", features = ["content-identity"] }
mrr-data-content = { git = "https://github.com/tao3k/mrr-data.git", rev = "203dec657ba4e57ba4b8313ae18415aab5547f95", features = ["snapshot"] }
mrr-data-datafusion = { git = "https://github.com/tao3k/mrr-data.git", rev = "203dec657ba4e57ba4b8313ae18415aab5547f95" }
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
arrow-ipc = "58.4.0"
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt", "macros"] }

# Match the physical owner's qualified test build; preserve native integer precision.
[profile.dev]
opt-level = 2
codegen-units = 16
debug = false

[build-dependencies]
toml = "0.9.12"
