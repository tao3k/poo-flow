[package]
name = "poo-temporal-physical-roundtrip"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0 AND LGPL-2.1-or-later"
[workspace]
[workspace.package]
license = "Apache-2.0 AND LGPL-2.1-or-later"
[dependencies]
poo-flow-rust-runtime = { path = "../..", features = ["mrr-transport"] }
meta-relational-reasoning = { git = "https://github.com/tao3k/meta-relational-reasoning.git", rev = "ea80f9b97bde2faf4c125286659799c4c50a0f54", default-features = false }
mrr-property-source = { git = "https://github.com/tao3k/meta-relational-reasoning.git", rev = "ea80f9b97bde2faf4c125286659799c4c50a0f54" }
mrr-data-core = { git = "https://github.com/tao3k/mrr-data.git", rev = "e93a7074f8746a55c53e19b85ecf26ffcb6ef3e4", features = ["content-identity"] }
mrr-data-content = { git = "https://github.com/tao3k/mrr-data.git", rev = "e93a7074f8746a55c53e19b85ecf26ffcb6ef3e4", features = ["snapshot"] }
mrr-data-datafusion = { git = "https://github.com/tao3k/mrr-data.git", rev = "e93a7074f8746a55c53e19b85ecf26ffcb6ef3e4" }
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
arrow-ipc = "58.4.0"
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt", "macros"] }

# Match the physical owner's qualified test build; preserve native integer precision.
[profile.dev]
opt-level = 2
codegen-units = 16
debug = false

[build-dependencies]
toml = "0.9.12"
